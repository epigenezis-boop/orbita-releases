<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbita Discovery Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#151923;color:#f4e9dc;font:16px 'Segoe UI',sans-serif}main{max-width:1100px;margin:32px auto;padding:24px}header{display:flex;align-items:center;gap:14px}h1{font-size:29px;letter-spacing:2px;margin:0}small,.muted{color:#aab1bf}section{background:#202633;border:1px solid #343b4b;border-radius:20px;padding:22px;margin-top:18px}label{display:block;color:#aab1bf;font-size:13px;margin:12px 0 5px}input,select,button{font:inherit;border:1px solid #42495a;border-radius:10px;background:#171c28;color:#f4e9dc;padding:10px}input{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#ecaa87;color:#241a1b;font-weight:700;border:0}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}article{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #343b4b;padding:13px 0}article:last-child{border:0}.track{font-weight:600}.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chosen{background:#72b9b1;color:#102624}a{color:#ecaa87}#status{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:700px){.grid{grid-template-columns:1fr}article{grid-template-columns:1fr}}
</style><main><header><span style="font-size:38px;color:#ecaa87">◉</span><div><h1>ORBITA / DISCOVERY LAB</h1><small>2.0 alpha · отдельный тестовый стенд</small></div></header>
<section><label for="token">Токен ListenBrainz (только на время сеанса)</label><input id="token" type="password" autocomplete="off" spellcheck="false"><label for="proxy">Локальный прокси VPN (можно оставить пустым)</label><input id="proxy" value="http://127.0.0.1:10809"><div class="grid"><div><label for="seeds">Исполнители, через точку с запятой (до 4)</label><input id="seeds" value="Nightwish; Epica; Within Temptation"></div><div><label for="mode">Глубина поиска</label><select id="mode"><option value="easy">Близкие</option><option value="medium" selected>Смешанные</option><option value="hard">Дальние</option></select></div><div><label for="count">Кандидатов</label><select id="count"><option>10</option><option selected>20</option><option>30</option></select></div></div><div class="actions"><button id="go" class="primary">Найти музыку</button><button id="cancel" disabled>Остановить</button><button id="export" disabled>Экспорт отчёта JSON</button></div><p class="muted" id="status">Готов к поиску. История прослушиваний никуда не отправляется.</p></section>
<section><h2>Найденные композиции</h2><p class="muted">Результаты ListenBrainz + MusicBrainz. Наличие в Звуке проверяется вручную. <a href="https://zvuk.com/" target="_blank" rel="noopener noreferrer">Открыть Звук</a></p><div id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id);const nonce='__NONCE__';let report=null;
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x;}
function button(text,action){const x=el('button',text);x.addEventListener('click',action);return x;}
async function request(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Orbita-Nonce':nonce},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j;}
function render(){const root=$('results');root.replaceChildren();if(!report)return;for(const c of report.candidates){const row=el('article','');const info=el('div','');info.append(el('div',c.title+' — '+c.artist_credit,'track'),el('small',(c.releases[0]?.title||'Издание не указано')+' · Источники: '+c.seeds.join(', ')));const controls=el('div','','chips');const query=c.artist_credit+' '+c.title;controls.append(button('Копировать поиск',async()=>{try{await navigator.clipboard.writeText(query);}catch{prompt('Скопируйте запрос',query);}}));for(const [v,t] of [['found','Есть в Звуке'],['missing','Нет в Звуке'],['wrong','Не та версия']]){const b=button(t,()=>{c.zvuk_match_status=c.zvuk_match_status===v?'not_checked':v;render();});if(c.zvuk_match_status===v)b.className='chosen';controls.append(b);}for(const [v,t] of [[1,'Нравится'],[-1,'Не нравится']]){const b=button(t,()=>{c.rating=c.rating===v?null:v;render();});if(c.rating===v)b.className='chosen';controls.append(b);}row.append(info,controls);root.append(row);}}
$('go').onclick=async()=>{$('go').disabled=true;$('cancel').disabled=false;$('export').disabled=true;$('status').textContent='Запрашиваем музыкальные данные…';try{report=await request('/discover',{token:$('token').value.trim(),proxy:$('proxy').value.trim(),seeds:$('seeds').value.split(';').map(s=>s.trim()).filter(Boolean),mode:$('mode').value,count:Number($('count').value)});$('status').textContent='Найдено: '+report.candidates.length+(report.cancelled?' · Остановлено':'')+(report.errors.length?'\n'+report.errors.map(e=>e.seed+': '+e.error).join('\n'):'');render();$('export').disabled=false;}catch(e){$('status').textContent=e.message;}finally{$('go').disabled=false;$('cancel').disabled=true;$('token').value='';}};
$('cancel').onclick=()=>request('/cancel',{}).catch(e=>$('status').textContent=e.message);
$('export').onclick=()=>{if(!report)return;const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='orbita-discovery-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
